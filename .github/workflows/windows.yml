name: Desktop checks

on:
  push:
    branches: ["ios/macbook", "windows", "ubuntu", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tools
        run: python -m pip install pytest "pypdf>=6.18,<7" "python-docx>=1.1"
      - name: Check Python syntax
        run: python -m compileall -q core legacy windows
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run tests
        run: python -m pytest -q core/tests legacy/tk-версия/test_v25_10.py legacy/tk-версия/test_gui_flows_v25_10.py legacy/tk-версия/test_ui_contract_v25_10.py
      - name: Check Swift runtime
        if: runner.os == 'macOS'
        run: bash packaging/test_swift.sh
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: bash packaging/build_app.sh
