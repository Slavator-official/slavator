name: Ubuntu

on:
  push:
    branches: ["ubuntu"]
  pull_request:
    branches: ["ubuntu"]

jobs:
  core-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tools
        run: python -m pip install pytest
      - name: Check Python syntax
        run: python -m compileall -q core legacy windows
      - name: Run portable core tests
        run: python -m pytest -q core/tests
